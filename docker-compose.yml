services:

  postgres:
    image: postgres:17
    container_name: food-ordering-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: food_ordering
      POSTGRES_USER: food_app
      POSTGRES_PASSWORD: food_app_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_app -d food_ordering"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: food-ordering-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://food_app:food_app_password@postgres:5432/food_ordering

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000

    container_name: food-ordering-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data:
